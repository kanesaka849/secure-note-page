name: reflect-mail

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'ci_trigger/**'

permissions:
  contents: write

# 同時実行を直列化：並行した2つのrunが「古いスクリプトのビルド結果で後から上書き」する競合を防ぐ
concurrency:
  group: reflect-mail
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography

      - name: Process calendar requests (add/delete from dashboard)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          KANESAKA_CALENDAR_REFRESH_TOKEN: ${{ secrets.KANESAKA_CALENDAR_REFRESH_TOKEN }}
        run: python .github/scripts/process_calendar_requests.py

      - name: Fetch mail & judge with Anthropic API
        env:
          MAIL_KANESAKA_ACTIVIA: ${{ secrets.MAIL_KANESAKA_ACTIVIA }}
          MAIL_KANESAKA_ACTIVIA_PASS: ${{ secrets.MAIL_KANESAKA_ACTIVIA_PASS }}
          MAIL_TRIAL_AGNIYOGA: ${{ secrets.MAIL_TRIAL_AGNIYOGA }}
          MAIL_TRIAL_AGNIYOGA_PASS: ${{ secrets.MAIL_TRIAL_AGNIYOGA_PASS }}
          MAIL_SCHOOL_AGNIYOGA: ${{ secrets.MAIL_SCHOOL_AGNIYOGA }}
          MAIL_SCHOOL_AGNIYOGA_PASS: ${{ secrets.MAIL_SCHOOL_AGNIYOGA_PASS }}
          MAIL_KANESAKA_AGNIYOGA: ${{ secrets.MAIL_KANESAKA_AGNIYOGA }}
          MAIL_KANESAKA_AGNIYOGA_PASS: ${{ secrets.MAIL_KANESAKA_AGNIYOGA_PASS }}
          ZIPYOGA_INFO_USER: ${{ secrets.ZIPYOGA_INFO_USER }}
          ZIPYOGA_INFO_PASS: ${{ secrets.ZIPYOGA_INFO_PASS }}
          ZIPYOGA_POP_SERVER: ${{ secrets.ZIPYOGA_POP_SERVER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          KANESAKA_GMAIL_REFRESH_TOKEN: ${{ secrets.KANESAKA_GMAIL_REFRESH_TOKEN }}
          AGNIYOGA_AD_GMAIL_REFRESH_TOKEN: ${{ secrets.AGNIYOGA_AD_GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_PW: ${{ secrets.DASHBOARD_PW }}
        run: python .github/scripts/ci_fetch_and_judge.py

      - name: Rebuild encrypted dashboard
        env:
          DASHBOARD_PW: ${{ secrets.DASHBOARD_PW }}
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          KANESAKA_CALENDAR_REFRESH_TOKEN: ${{ secrets.KANESAKA_CALENDAR_REFRESH_TOKEN }}
        run: python .github/scripts/rebuild_all.py

      - name: Commit & push (only built output, never ci_input/ raw mail)
        run: |
          git config user.name "reflect-mail-bot"
          git config user.email "actions@github.com"
          git add kanesaka-tasks.html kanesaka-mail-all.html kanesaka-task-history.html kanesaka-mail-rules.html api_usage_log.json sender_rules.json
          git add ci_trigger/calendar_requests.json 2>/dev/null || true
          git add ci_trigger/advice_requests.json 2>/dev/null || true
          git add advice_store.enc 2>/dev/null || true
          git add kpi_history.enc 2>/dev/null || true
          git add mail_judgment_cache.json 2>/dev/null || true
          git add pending_judgment.enc 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "reflect-mail: auto update $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # 実行中（数分間）にダッシュボードのボタン操作（✕/✓/🤖AI等）がmainへコミットすると
          # 素のpushは拒否され、run全体（AIアドバイス生成・再ビルド）が無駄になっていた。
          # → rebaseして再試行。コンフリクトはユーザー操作系ファイル＝ブラウザ側優先、
          #   ビルド生成物＝このrun優先で機械的に解決する（rebase中は ours=origin / theirs=このrun）
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (browser commit during run) - rebase & retry $i"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours sender_rules.json ci_trigger/calendar_requests.json ci_trigger/advice_requests.json 2>/dev/null || true
              git checkout --theirs kanesaka-tasks.html kanesaka-mail-all.html kanesaka-task-history.html kanesaka-mail-rules.html api_usage_log.json advice_store.enc kpi_history.enc mail_judgment_cache.json pending_judgment.enc 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 3
          done
          echo "push failed after retries"
          exit 1
