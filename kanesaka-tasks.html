<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Page</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #0f172a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#lock-screen {
  background: #1e293b;
  border-radius: 16px;
  padding: 40px 48px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
  border: 1px solid #334155;
}
.lock-icon { text-align: center; font-size: 48px; margin-bottom: 20px; }
h1 { text-align: center; color: #e2e8f0; font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 28px; }
label { display: block; color: #94a3b8; font-size: 12px; font-weight: 600;
         text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
input[type=text], input[type=password] {
  width: 100%; background: #0f172a; border: 1px solid #334155;
  border-radius: 8px; padding: 12px 16px; color: #e2e8f0; font-size: 15px;
  outline: none; transition: border-color .2s;
}
input[type=text]:focus, input[type=password]:focus { border-color: #3b82f6; }
button {
  width: 100%; margin-top: 16px; background: #3b82f6; color: white;
  border: none; border-radius: 8px; padding: 13px; font-size: 15px;
  font-weight: 600; cursor: pointer; transition: background .2s;
}
button:hover { background: #2563eb; }
button:disabled { background: #374151; cursor: not-allowed; }
#status { margin-top: 12px; text-align: center; font-size: 13px;
           color: #ef4444; min-height: 20px; }
#status.working { color: #94a3b8; }
#login-form { display: none; }
</style>
</head>
<body>
<div id="lock-screen">
  <div class="lock-icon">&#x1F510;</div>
  <h1 id="lock-title">&#x8AAD;&#x307F;&#x8FBC;&#x307F;&#x4E2D;&#x2026;</h1>
  <p class="subtitle" id="lock-sub"></p>
  <div id="login-form">
    <form onsubmit="unlock(); return false;" autocomplete="on">
      <label for="uid-input">ID</label>
      <input type="text" id="uid-input" name="username" autocomplete="username"
             placeholder="ID" style="margin-bottom:16px" autofocus>
      <label for="pw-input">&#x30D1;&#x30B9;&#x30EF;&#x30FC;&#x30C9;</label>
      <input type="password" id="pw-input" name="password" autocomplete="current-password"
             placeholder="Password">
      <button id="unlock-btn" type="submit">&#x30ED;&#x30C3;&#x30AF;&#x89E3;&#x9664;</button>
    </form>
    <div id="status"></div>
  </div>
</div>

function b64ToBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

  );
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64ToBuffer(SALT), iterations:ITER, hash:'SHA-256' },
    keyMat, { name:'AES-CBC', length:256 }, false, ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt(
    { name:'AES-CBC', iv:b64ToBuffer(IV) }, key, b64ToBuffer(CT)
  );
  return new TextDecoder('utf-8').decode(decrypted);
}

async function unlock() {
  const uid = document.getElementById('uid-input').value.trim();
  const pw  = document.getElementById('pw-input').value;
  if (!uid || !pw) return;
  const btn = document.getElementById('unlock-btn');
  const st  = document.getElementById('status');
  btn.disabled = true;
  st.className = 'working';
  st.textContent = '\u5FA9\u53F7\u4E2D\u2026';
  try {
    const html = await decryptWith(uid, pw);
    sessionStorage.setItem(SK_UID, uid);
    sessionStorage.setItem(SK_PW, pw);
    document.open(); document.write(html); document.close();
  } catch(e) {
    sessionStorage.removeItem(SK_UID);
    sessionStorage.removeItem(SK_PW);
    st.className = '';
    st.textContent = '\u30D1\u30B9\u30EF\u30FC\u30C9\u304C\u9055\u3044\u307E\u3059';
    btn.disabled = false;
  }
}

// ページ読み込み時: sessionStorage にキャッシュがあれば自動復号
(async () => {
  const uid = sessionStorage.getItem(SK_UID);
  const pw  = sessionStorage.getItem(SK_PW);
  if (uid && pw) {
    try {
      const html = await decryptWith(uid, pw);
      document.open(); document.write(html); document.close();
      return;
    } catch(e) {
      sessionStorage.removeItem(SK_UID);
      sessionStorage.removeItem(SK_PW);
    }
  }
  // キャッシュなし or 失敗 → ログインフォームを表示
  document.getElementById('lock-title').textContent = '\u30A2\u30AF\u30BB\u30B9\u5236\u9650';
  document.getElementById('lock-sub').textContent = '\u3053\u306E\u30DA\u30FC\u30B8\u306F\u30D1\u30B9\u30EF\u30FC\u30C9\u3067\u4FDD\u8B77\u3055\u308C\u3066\u3044\u307E\u3059';
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('uid-input').focus();
})();
