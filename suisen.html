var PWKEY="juken_pw_v1";
async function dec(pw){var raw=atob(CIPHER);var b=new Uint8Array(raw.length);
 for(var i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);
 var salt=b.slice(8,16);var data=b.slice(16);
 var bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},bk,384);
 var kb=new Uint8Array(bits);
 var key=await crypto.subtle.importKey("raw",kb.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:kb.slice(32,48)},key,data);
 return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
function op(){var pw=document.getElementById("pw").value;var e=document.getElementById("err");e.textContent="";
 dec(pw).then(function(html){try{localStorage.setItem(PWKEY,pw);}catch(_){}show(html);})
 .catch(function(){e.textContent="パスワードが違います";});}
document.getElementById("go").addEventListener("click",op);
document.getElementById("pw").addEventListener("keydown",function(ev){if(ev.key==="Enter")op();});
(function(){var s=null;try{s=localStorage.getItem(PWKEY);}catch(_){}
 if(s){document.getElementById("err").textContent="自動で開いています…";
  dec(s).then(show).catch(function(){try{localStorage.removeItem(PWKEY);}catch(_){}document.getElementById("err").textContent="";});}})();
</script>
