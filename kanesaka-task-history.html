function b64ToBuffer(b64){const bin=atob(b64),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}
async function decryptWith(uid,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(uid+':'+pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuffer(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  const dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64ToBuffer(IV)},key,b64ToBuffer(CT));
  return new TextDecoder('utf-8').decode(dec);
}
function renderDecrypted(html){
  var p=new DOMParser(),d=p.parseFromString(html,'text/html');
  document.title=d.title||document.title;
  document.head.querySelectorAll('style').forEach(function(s){s.remove();});
  d.head.querySelectorAll('style').forEach(function(s){var ns=document.createElement('style');ns.textContent=s.textContent;document.head.appendChild(ns);});
  var scripts=[];
  d.body.querySelectorAll('script').forEach(function(s){scripts.push(s.textContent);s.remove();});
  document.body.innerHTML=d.body.innerHTML;
  scripts.forEach(function(src){var s=document.createElement('script');s.textContent=src;document.body.appendChild(s);});
}
async function unlock(){
  const uid=document.getElementById('uid-input').value.trim(),pw=document.getElementById('pw-input').value;
  if(!uid||!pw)return;
  const btn=document.getElementById('unlock-btn'),st=document.getElementById('status');
  btn.disabled=true;st.className='working';st.textContent='\u5FA9\u53F7\u4E2D\u2026';
  try{const html=await decryptWith(uid,pw);sessionStorage.setItem(SK_UID,uid);sessionStorage.setItem(SK_PW,pw);renderDecrypted(html);}
  catch(e){sessionStorage.removeItem(SK_UID);sessionStorage.removeItem(SK_PW);st.className='';st.textContent='\u30D1\u30B9\u30EF\u30FC\u30C9\u304C\u9055\u3044\u307E\u3059';btn.disabled=false;}
}
(async()=>{
  const uid=sessionStorage.getItem(SK_UID),pw=sessionStorage.getItem(SK_PW);
  if(uid&&pw){try{const html=await decryptWith(uid,pw);renderDecrypted(html);return;}catch(e){sessionStorage.removeItem(SK_UID);sessionStorage.removeItem(SK_PW);}}
  document.getElementById('lock-title').textContent='\u30A2\u30AF\u30BB\u30B9\u5236\u9650';
  document.getElementById('lock-sub').innerHTML=`<a href="kanesaka-tasks.html" style="color:#94a3b8;font-size:13px;text-decoration:none;">← 戻る</a>`;
  document.getElementById('login-form').style.display='block';
  document.getElementById('uid-input').focus();
})();
