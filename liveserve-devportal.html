*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Hiragino Sans','Meiryo',sans-serif;background:#0b3d3a;min-height:100vh;display:flex;align-items:center;justify-content:center;}
#lock-screen{background:#10514c;border-radius:16px;padding:40px 48px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.5);border:1px solid #1e6b64;}

.subtitle{text-align:center;color:#7fb8b2;font-size:13px;margin-bottom:28px;}
label{display:block;color:#9fd0ca;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
input{width:100%;background:#0b3d3a;border:1px solid #1e6b64;border-radius:8px;padding:12px 16px;color:#e6fffb;font-size:15px;outline:none;}

button{width:100%;margin-top:16px;background:#14b8a6;color:#04302c;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;}
button:disabled{background:#374151;color:#94a3b8;cursor:not-allowed;}

#status.working{color:#9fd0ca;}

function b64ToBuffer(b64){const bin=atob(b64),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}
async function decryptWith(uid,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(uid+':'+pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuffer(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  const dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64ToBuffer(IV)},key,b64ToBuffer(CT));
  return new TextDecoder('utf-8').decode(dec);
}
function renderDecrypted(html){
  // iframe だと iOS Safari で内部スクロールが崩れるため、ページ全体を差し替える
  document.open();document.write(html);document.close();
}
const AUTH_KEY='ls-devportal-auth';
async function unlock(){
  const uid=document.getElementById('uid-input').value.trim(),pw=document.getElementById('pw-input').value;
  if(!uid||!pw)return;
  const btn=document.getElementById('unlock-btn'),st=document.getElementById('status');
  btn.disabled=true;st.className='working';st.textContent='復号中…';
  try{
    const html=await decryptWith(uid,pw);
    try{localStorage.setItem(AUTH_KEY,JSON.stringify({u:uid,p:pw}));}catch(e){}
    renderDecrypted(html);
  }
  catch(e){st.className='';st.textContent='IDまたはパスワードが違います';btn.disabled=false;}
}
// 一度成功した端末では次回から自動で開く（保存済み認証で自動復号・失敗時は破棄してロック画面）
(async function(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(AUTH_KEY));}catch(e){}
  if(!saved||!saved.u||!saved.p)return;
  const st=document.getElementById('status');
  st.className='working';st.textContent='自動ログイン中…';
  try{const html=await decryptWith(saved.u,saved.p);renderDecrypted(html);}
  catch(e){try{localStorage.removeItem(AUTH_KEY);}catch(_){}st.className='';st.textContent='';}
})();
</script>
