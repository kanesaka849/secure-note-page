async function dec(pw){var raw=atob(CIPHER);var b=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);var salt=b.slice(8,16);var data=b.slice(16);var e=new TextEncoder();var bk=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},bk,384);var kb=new Uint8Array(bits);var key=await crypto.subtle.importKey("raw",kb.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:kb.slice(32,48)},key,data);return new TextDecoder().decode(pt);}
