async function decryptWith(uid,pw){

function renderDecrypted(html){
  var p=new DOMParser(),d=p.parseFromString(html,'text/html');
  document.title=d.title||document.title;
  document.head.querySelectorAll('style').forEach(function(s){s.remove();});
  d.head.querySelectorAll('style').forEach(function(s){var ns=document.createElement('style');ns.textContent=s.textContent;document.head.appendChild(ns);});
  var scripts=[];
  d.body.querySelectorAll('script').forEach(function(s){scripts.push(s.textContent);s.remove();});
  document.body.innerHTML=d.body.innerHTML;
  scripts.forEach(function(src){var s=document.createElement('script');s.textContent=src;document.body.appendChild(s);});
}
async function unlock(){

}
