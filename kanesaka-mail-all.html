async function decryptWith(uid,pw){
  const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(uid+':'+pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuffer(SALT),iterations:ITER,hash:'SHA-256'},keyMat,{name:'AES-CBC',length:256},false,['decrypt']);

async function unlock(){
  const uid=document.getElementById('uid-input').value.trim();
  const pw=document.getElementById('pw-input').value;
  if(!uid||!pw)return;
  const btn=document.getElementById('unlock-btn'),st=document.getElementById('status');
  btn.disabled=true;st.className='working';st.textContent='\u5FA9\u53F7\u4E2D\u2026';
  try{
    const html=await decryptWith(uid,pw);
    sessionStorage.setItem(SK_UID,uid);sessionStorage.setItem(SK_PW,pw);
    document.open();document.write(html);document.close();
  }catch(e){
    sessionStorage.removeItem(SK_UID);sessionStorage.removeItem(SK_PW);
    st.className='';st.textContent='\u30D1\u30B9\u30EF;\u30FC\u30C9\u304C\u9055\u3044\u307E\u3059';
    btn.disabled=false;
  }
}
